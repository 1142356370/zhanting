<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>展厅漫游</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; font-family: "Microsoft YaHei", sans-serif; touch-action: none; background: #111; }

        #loading {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #fff;
            transition: opacity 0.8s ease;
        }
        #loading.hidden { opacity: 0; pointer-events: none; }
        #loading-spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top: 3px solid #6c8cff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loading-progress-text { font-size: 14px; letter-spacing: 2px; color: rgba(255,255,255,0.6); }

        #crosshair {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 8px; height: 8px;
            background: red;
            border-radius: 50%;
            z-index: 150;
            pointer-events: none;
            display: none;
        }

        #instructions {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            text-align: center;
            z-index: 200;
            background: rgba(0,0,0,0.75);
            padding: 10px 18px;
            border-radius: 8px;
            pointer-events: none;
            line-height: 1.8;
            white-space: nowrap;
        }

        #rotate-btn {
            position: fixed;
            top: 12px; right: 12px;
            padding: 10px 16px;
            background: rgba(0,0,0,0.75);
            border: 1.5px solid #6c8cff;
            color: #6c8cff;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            z-index: 999;
            cursor: pointer;
            display: none;
            backdrop-filter: blur(4px);
        }

        #info-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            z-index: 500;
            display: none;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        #info-modal.show { display: flex; }

        #modal-image {
            max-width: 80vw;
            max-height: 80vh;
            object-fit: contain;
            background: #fff;
            cursor: grab;
            user-select: none;
            touch-action: none;
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }

        #nav-left, #nav-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.85);
            color: #222;
            border-radius: 50%;
            font-size: 28px;
            font-weight: bold;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            z-index: 510;
            transition: background 0.2s;
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }
        #nav-left:hover, #nav-right:hover { background: #fff; }
        #nav-left { left: 16px; }
        #nav-right { right: 16px; }

        #close-btn {
            position: absolute;
            top: 20px; right: 24px;
            background: rgba(255,60,60,0.9);
            color: #fff;
            border: none;
            border-radius: 30px;
            padding: 8px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 510;
            transition: background 0.2s;
        }
        #close-btn:hover { background: #ff2020; }

        #joystick-container {
            position: fixed;
            bottom: 30px; left: 24px;
            width: 110px; height: 110px;
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            z-index: 250;
            display: none;
            touch-action: none;
            backdrop-filter: blur(4px);
        }
        #joystick-knob {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 46px; height: 46px;
            background: rgba(108,140,255,0.8);
            border: 2px solid rgba(255,255,255,0.9);
            border-radius: 50%;
            pointer-events: none;
            box-shadow: 0 0 20px rgba(108,140,255,0.3);
        }

        #app-container {
            position: fixed;
            top: 0; left: 0;
            width: 100vw;
            height: 100vh;
            transform-origin: center center;
        }
        #app-container.rotated {
            transform: rotate(90deg);
            width: 100vh;
            height: 100vw;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        @media (pointer: coarse) {
            #joystick-container { display: block; }
            #crosshair { display: block; }
            #instructions { display: none; }
            #rotate-btn { display: block; }
        }

        @media (max-width: 480px) {
            #joystick-container { width: 90px; height: 90px; bottom: 20px; left: 16px; }
            #joystick-knob { width: 38px; height: 38px; }
            #rotate-btn { font-size: 12px; padding: 8px 12px; }
        }
    </style>

    <!-- 🔥 全部使用 CDN，不需要任何本地文件 -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.163.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.163.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="app-container">
    <div id="loading">
        <div id="loading-spinner"></div>
        <div id="loading-progress-text">加载中 0%</div>
    </div>

    <div id="crosshair"></div>

    <div id="instructions">
        <b>W A S D</b> 移动 &nbsp; <b>鼠标</b> 转动视角 &nbsp; <b>Q / E</b> 升降视角
    </div>

    <div id="joystick-container">
        <div id="joystick-knob"></div>
    </div>

    <div id="info-modal">
        <img id="modal-image" src="" alt="图片加载失败">
        <button id="close-btn">✕ 关闭</button>
        <div id="nav-left">❮</div>
        <div id="nav-right">❯</div>
    </div>

    <div id="canvas-container"></div>
</div>

<button id="rotate-btn">📱 横屏</button>

<script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // --- 初始化场景、相机、渲染器 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111122);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(0, 2.5, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    // --- 灯光 ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(8, 15, 10);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x8888ff, 0.6);
    fillLight.position.set(-5, 3, -8);
    scene.add(fillLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444466, 0.8);
    scene.add(hemiLight);

    // --- 地面辅助网格（方便观察） ---
    const gridHelper = new THREE.GridHelper(30, 20, 0x6c8cff, 0x334488);
    gridHelper.position.y = -0.01;
    scene.add(gridHelper);

    // --- 加载管理器 ---
    const loadingScreen = document.getElementById('loading');
    const progressText = document.getElementById('loading-progress-text');

    const manager = new THREE.LoadingManager();
    manager.onProgress = (url, loaded, total) => {
        const pct = Math.round((loaded / total) * 100);
        progressText.textContent = `加载中 ${pct}%`;
    };
    manager.onLoad = () => {
        setTimeout(() => {
            loadingScreen.classList.add('hidden');
            setTimeout(() => loadingScreen.style.display = 'none', 600);
        }, 300);
    };
    manager.onError = (url) => {
        progressText.textContent = '⚠️ 资源加载失败，请检查网络或文件路径';
        console.error('加载失败:', url);
    };

    // --- 加载 3D 模型 ---
    let mainModel = null;
    const loader = new GLTFLoader(manager);
    const dracoLoader = new DRACOLoader();
    dracoLoader.setDecoderPath('https://www.gstatic.com/draco/v1/decoders/');
    loader.setDRACOLoader(dracoLoader);

    // ⚠️ 重要：把 '你的模型.glb' 换成你实际的模型文件名
    // 如果模型在子目录，写成 '子目录/模型.glb'
    const MODEL_URL = '0904.glb';

    loader.load(
        MODEL_URL,
        (gltf) => {
            const model = gltf.scene;
            mainModel = model;

            // 处理材质
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    const matName = child.material ? child.material.name : '';
                    if (matName.includes('M_Basic_Wall')) {
                        child.material = new THREE.MeshStandardMaterial({
                            color: 0xf5f5f5,
                            roughness: 0.85,
                            metalness: 0.0
                        });
                    }
                }
            });

            // 自动适配大小
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const targetSize = 18;
            const scale = targetSize / maxDim;
            model.scale.set(scale, scale, scale);

            const newBox = new THREE.Box3().setFromObject(model);
            const newCenter = newBox.getCenter(new THREE.Vector3());
            const newMinY = newBox.min.y;
            model.position.x -= newCenter.x;
            model.position.z -= newCenter.z;
            model.position.y -= newMinY;

            scene.add(model);
            camera.position.set(0, 2.2, 10);
            camera.lookAt(0, 1.5, 0);

            console.log('✅ 模型加载成功');
        },
        undefined,
        (error) => {
            progressText.textContent = '❌ 模型加载失败，请检查文件路径';
            console.error('模型加载错误:', error);
        }
    );

    // --- 展板点击映射 ---
    const uiMapping = {
        "组_339": ["01序言.png"],
        "组_316": ["03高管中心.png"],
        "组_344": ["05投资建设.png"],
        "组_5": ["06工程验收.png"],
        "组_317": ["07依法规划.png"],
        "组_335": ["08一路三方.png"],
        "组_320": ["09依法征收.png"],
        "组_20": ["10行车安全教育.png"],
        "组_33": ["12vr.png"],
        "组_27": ["13-1谨慎驾驶.png"],
        "组_313": ["13-2谨慎驾驶.png"],
        "组_322": ["14-1依法打逃.png", "14-2.png"],
        "组_323": ["15品质护航.png"],
        "组_38": ["16依法经营.png"],
        "组_331": ["17-1.png", "17-2.png", "17-3.png"],
        "组_328": ["19结束语.png"]
    };

    // --- 图片弹窗 ---
    const modal = document.getElementById('info-modal');
    const modalImg = document.getElementById('modal-image');
    const closeBtn = document.getElementById('close-btn');
    const navLeft = document.getElementById('nav-left');
    const navRight = document.getElementById('nav-right');

    let currentImages = [];
    let currentIndex = 0;
    let imgScale = 1;
    let imgTranslateX = 0;
    let imgTranslateY = 0;

    function openModal(imageList) {
        currentImages = imageList;
        currentIndex = 0;
        modalImg.src = currentImages[0];
        modal.classList.add('show');
        navLeft.style.display = currentImages.length > 1 ? 'flex' : 'none';
        navRight.style.display = currentImages.length > 1 ? 'flex' : 'none';
        resetImageTransform();
        if (document.pointerLockElement) document.exitPointerLock();
    }

    window.closeModal = function() {
        modal.classList.remove('show');
        setTimeout(() => renderer.domElement.requestPointerLock(), 100);
    };
    closeBtn.addEventListener('click', window.closeModal);

    navLeft.addEventListener('click', () => {
        if (currentImages.length === 0) return;
        currentIndex = (currentIndex - 1 + currentImages.length) % currentImages.length;
        modalImg.src = currentImages[currentIndex];
        resetImageTransform();
    });

    navRight.addEventListener('click', () => {
        if (currentImages.length === 0) return;
        currentIndex = (currentIndex + 1) % currentImages.length;
        modalImg.src = currentImages[currentIndex];
        resetImageTransform();
    });

    // 点击外部关闭
    modal.addEventListener('click', (e) => {
        if (e.target === modal) window.closeModal();
    });

    // --- 图片缩放拖拽 ---
    function applyImageTransform() {
        modalImg.style.transform = `translate(${imgTranslateX}px, ${imgTranslateY}px) scale(${imgScale})`;
    }
    function resetImageTransform() {
        imgScale = 1;
        imgTranslateX = 0;
        imgTranslateY = 0;
        applyImageTransform();
    }

    // 鼠标滚轮缩放
    modal.addEventListener('wheel', (e) => {
        if (!modal.classList.contains('show')) return;
        e.preventDefault();
        imgScale = Math.max(0.3, Math.min(4, imgScale - e.deltaY * 0.001));
        applyImageTransform();
    }, { passive: false });

    // 鼠标拖拽
    let isDragging = false;
    let dragStartX = 0, dragStartY = 0;
    modalImg.addEventListener('mousedown', (e) => {
        isDragging = true;
        dragStartX = e.clientX - imgTranslateX;
        dragStartY = e.clientY - imgTranslateY;
        modalImg.style.cursor = 'grabbing';
    });
    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        imgTranslateX = e.clientX - dragStartX;
        imgTranslateY = e.clientY - dragStartY;
        applyImageTransform();
    });
    document.addEventListener('mouseup', () => {
        isDragging = false;
        modalImg.style.cursor = 'grab';
    });

    // 手机触摸缩放拖拽
    let lastTouchDist = 0;
    let initialPinchScale = 1;
    let isTouchDrag = false;
    let touchStartX = 0, touchStartY = 0;

    modalImg.addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (e.touches.length === 1) {
            isTouchDrag = true;
            touchStartX = e.touches[0].clientX - imgTranslateX;
            touchStartY = e.touches[0].clientY - imgTranslateY;
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            lastTouchDist = Math.sqrt(dx*dx + dy*dy);
            initialPinchScale = imgScale;
            isTouchDrag = false;
        }
    }, { passive: false });

    modalImg.addEventListener('touchmove', (e) => {
        e.preventDefault();
        if (e.touches.length === 1 && isTouchDrag) {
            imgTranslateX = e.touches[0].clientX - touchStartX;
            imgTranslateY = e.touches[0].clientY - touchStartY;
            applyImageTransform();
        } else if (e.touches.length === 2) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (lastTouchDist > 0) {
                imgScale = Math.max(0.3, Math.min(4, initialPinchScale * (dist / lastTouchDist)));
                applyImageTransform();
            }
        }
    }, { passive: false });

    modalImg.addEventListener('touchend', () => {
        isTouchDrag = false;
        lastTouchDist = 0;
    }, { passive: false });

    // --- 点击检测 ---
    const raycaster = new THREE.Raycaster();
    const centerVec = new THREE.Vector2(0, 0);

    renderer.domElement.addEventListener('click', () => {
        if (!mainModel) return;
        raycaster.setFromCamera(centerVec, camera);
        const hits = raycaster.intersectObject(mainModel, true);
        for (const hit of hits) {
            let obj = hit.object;
            while (obj) {
                if (uiMapping[obj.name]) {
                    openModal(uiMapping[obj.name]);
                    return;
                }
                obj = obj.parent;
            }
        }
    });

    // --- 键盘控制 ---
    const keys = { w: false, a: false, s: false, d: false, q: false, e: false };
    document.addEventListener('keydown', (e) => {
        if (e.key in keys) keys[e.key] = true;
        if (e.key === 'Escape') {
            // 重置视角
            camera.position.set(0, 2.2, 10);
            camera.lookAt(0, 1.5, 0);
            yaw = 0;
            pitch = 0;
        }
    });
    document.addEventListener('keyup', (e) => {
        if (e.key in keys) keys[e.key] = false;
    });

    // --- 鼠标视角控制 ---
    let yaw = 0;
    let pitch = 0;
    let isPointerLocked = false;

    document.addEventListener('pointerlockchange', () => {
        isPointerLocked = document.pointerLockElement === renderer.domElement;
        document.getElementById('crosshair').style.display = isPointerLocked ? 'block' : 'none';
    });

    renderer.domElement.addEventListener('click', () => {
        if (!modal.classList.contains('show') && !isPointerLocked) {
            renderer.domElement.requestPointerLock();
        }
    });

    document.addEventListener('mousemove', (e) => {
        if (!isPointerLocked) return;
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-0.8, Math.min(0.8, pitch));
    });

    // --- 手机摇杆 ---
    let joyX = 0, joyY = 0;
    const joyContainer = document.getElementById('joystick-container');
    const joyKnob = document.getElementById('joystick-knob');
    const JOY_RADIUS = 35;

    function updateJoystick(touch) {
        const rect = joyContainer.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;
        let dx = touch.clientX - cx;
        let dy = touch.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist > JOY_RADIUS) {
            dx = (dx / dist) * JOY_RADIUS;
            dy = (dy / dist) * JOY_RADIUS;
        }
        joyX = dx / JOY_RADIUS;
        joyY = dy / JOY_RADIUS;
        joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetJoystick() {
        joyX = 0; joyY = 0;
        joyKnob.style.transform = 'translate(-50%, -50%)';
    }

    joyContainer.addEventListener('touchstart', (e) => {
        e.preventDefault();
        updateJoystick(e.touches[0]);
    }, { passive: false });

    joyContainer.addEventListener('touchmove', (e) => {
        e.preventDefault();
        updateJoystick(e.touches[0]);
    }, { passive: false });

    joyContainer.addEventListener('touchend', (e) => {
        e.preventDefault();
        resetJoystick();
    }, { passive: false });

    // --- 手机触摸转动视角 ---
    let touchLookX = 0;
    let isTouchingLook = false;

    renderer.domElement.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        const rect = joyContainer.getBoundingClientRect();
        if (t.clientX >= rect.left && t.clientX <= rect.right &&
            t.clientY >= rect.top && t.clientY <= rect.bottom) return;
        isTouchingLook = true;
        touchLookX = t.clientX;
    }, { passive: true });

    renderer.domElement.addEventListener('touchmove', (e) => {
        if (!isTouchingLook) return;
        const t = e.touches[0];
        const delta = t.clientX - touchLookX;
        yaw -= delta * 0.005;
        touchLookX = t.clientX;
    }, { passive: true });

    renderer.domElement.addEventListener('touchend', () => {
        isTouchingLook = false;
    }, { passive: true });

    // --- 横屏切换 ---
    const appContainer = document.getElementById('app-container');
    const rotateBtn = document.getElementById('rotate-btn');

    rotateBtn.addEventListener('click', () => {
        appContainer.classList.toggle('rotated');
        rotateBtn.textContent = appContainer.classList.contains('rotated') ? '📱 竖屏' : '📱 横屏';

        setTimeout(() => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            const isRot = appContainer.classList.contains('rotated');
            const rw = isRot ? Math.max(w, h) : w;
            const rh = isRot ? Math.min(w, h) : h;
            renderer.setSize(rw, rh);
            camera.aspect = rw / rh;
            camera.updateProjectionMatrix();
        }, 50);
    });

    // --- 窗口自适应 ---
    window.addEventListener('resize', () => {
        const isRot = appContainer.classList.contains('rotated');
        let w = window.innerWidth;
        let h = window.innerHeight;
        if (isRot) { const t = w; w = h; h = t; }
        renderer.setSize(w, h);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
    });

    // --- 主循环 ---
    const MOVE_SPEED = 3.0;

    function animate() {
        requestAnimationFrame(animate);

        // 键盘移动
        const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
        const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
        const moveDir = new THREE.Vector3();

        if (keys.w) moveDir.add(forward);
        if (keys.s) moveDir.sub(forward);
        if (keys.a) moveDir.sub(right);
        if (keys.d) moveDir.add(right);
        // 摇杆
        moveDir.add(forward.clone().multiplyScalar(-joyY));
        moveDir.add(right.clone().multiplyScalar(joyX));

        if (moveDir.length() > 0) {
            moveDir.normalize();
            const delta = MOVE_SPEED * 0.016;
            const nextPos = camera.position.clone().add(moveDir.multiplyScalar(delta));
            // 简单碰撞检测
            if (mainModel) {
                const testRay = new THREE.Raycaster(camera.position, moveDir.clone().normalize());
                const hits = testRay.raycast(mainModel, true);
                let blocked = false;
                for (const hit of hits) {
                    if (hit.distance < 0.6) { blocked = true; break; }
                }
                if (!blocked) camera.position.copy(nextPos);
            } else {
                camera.position.copy(nextPos);
            }
        }

        // Q/E 升降
        if (keys.q) camera.position.y += 0.04;
        if (keys.e) camera.position.y -= 0.04;
        camera.position.y = Math.max(0.5, Math.min(4.5, camera.position.y));

        // 视角旋转
        const euler = new THREE.Euler(pitch, yaw, 0, 'YXZ');
        camera.quaternion.setFromEuler(euler);

        renderer.render(scene, camera);
    }

    animate();

    console.log('🚀 展厅漫游已启动！');
    console.log('📖 操作提示: WASD移动 | 鼠标拖拽视角 | Q/E升降 | 点击展板查看图片');
</script>
